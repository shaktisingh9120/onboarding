<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flabs Admin Dashboard</title>
  <link rel="stylesheet" href="home.css">

  <!-- LOGIN PROTECTION -->
  <script>
    if (sessionStorage.getItem("loggedIn") !== "true") {
      window.location.href = "../index.html";
    }
  </script>
</head>
<body>

<div class="app-shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-icon" title="Dashboard">
      <img src="logo.png" class="sidebar-logo" alt="Flabs">
    </div>
    <nav class="sidebar-nav">
      <a href="../lab-onboarding/index.html" class="nav-icon" title="Lab Onboarding">🏥</a>
      <a href="../duplicate-tool/index.html" class="nav-icon" title="Duplicate Tool">📄</a>
      <a href="../test-matching/index.html" class="nav-icon" title="Test Matching">🔍</a>
      <a href="../image-tool/index.html" class="nav-icon" title="Image Toolkit">🖼️</a>
    </nav>
    <button class="logout-btn" onclick="logout()" title="Logout">⇥</button>
  </aside>

  <!-- Main -->
  <main class="main">

    <div class="topbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="moduleSearch" placeholder="Search modules by name..." oninput="filterModules()">
      </div>
      <div class="topbar-right">
        <span class="brand-name">Flabs Admin Dashboard</span>
      </div>
    </div>

    <div class="table-card">
      <table class="module-table">
        <thead>
          <tr>
            <th>Sr No.</th>
            <th>Module</th>
            <th>Type</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="moduleTableBody">

          <tr class="module-row featured-row" data-name="lab onboarding">
            <td>01</td>
            <td class="module-name-cell">
              <span class="module-icon">🏥</span>
              <span>Lab Onboarding</span>
              <span class="badge">Featured</span>
            </td>
            <td><span class="type-pill">Operations</span></td>
            <td><span class="status-pill status-live">Live</span></td>
            <td><a href="../lab-onboarding/index.html" class="open-link">Open →</a></td>
          </tr>

          <tr class="module-row" data-name="duplicate tool">
            <td>02</td>
            <td class="module-name-cell">
              <span class="module-icon">📄</span>
              <span>Duplicate Tool</span>
            </td>
            <td><span class="type-pill">Cleaning</span></td>
            <td><span class="status-pill status-live">Live</span></td>
            <td><a href="../duplicate-tool/index.html" class="open-link">Open →</a></td>
          </tr>

          <tr class="module-row" data-name="test matching">
            <td>03</td>
            <td class="module-name-cell">
              <span class="module-icon">🔍</span>
              <span>Test Matching</span>
            </td>
            <td><span class="type-pill">Matching</span></td>
            <td><span class="status-pill status-live">Live</span></td>
            <td><a href="../test-matching/index.html" class="open-link">Open →</a></td>
          </tr>

          <tr class="module-row" data-name="image toolkit">
            <td>04</td>
            <td class="module-name-cell">
              <span class="module-icon">🖼️</span>
              <span>Image Toolkit</span>
            </td>
            <td><span class="type-pill">Utility</span></td>
            <td><span class="status-pill status-live">Live</span></td>
            <td><a href="../image-tool/index.html" class="open-link">Open →</a></td>
          </tr>

        </tbody>
      </table>

      <div class="no-data" id="noDataRow" style="display:none;">
        <div class="no-data-icon">📭</div>
        <p>No modules found</p>
      </div>
    </div>

  </main>
</div>

<script>
  function logout() {
    sessionStorage.clear();
    window.location.href = "../index.html";
  }

  function filterModules() {
    const query = document.getElementById("moduleSearch").value.trim().toLowerCase();
    const rows = document.querySelectorAll(".module-row");
    let visibleCount = 0;

    rows.forEach(row => {
      const name = row.getAttribute("data-name");
      const match = name.includes(query);
      row.style.display = match ? "" : "none";
      if (match) visibleCount++;
    });

    document.getElementById("noDataRow").style.display = visibleCount === 0 ? "flex" : "none";
  }
</script>

</body>
</html>
